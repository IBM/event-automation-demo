apiVersion: events.ibm.com/v1beta1
kind: EventGateway
metadata:
  name: {{ eventendpointmanagement_gateway_name }}
  labels:
    events.ibm.com/manager: {{ eventendpointmanagement_gateway_name }}
spec:
  gatewayGroupName: gateway-group
  gatewayID: gateway-1
  license:
    accept: {{ license_accept }}
    license: L-CYBH-K48BZQ
    metric: VIRTUAL_PROCESSOR_CORE
    use: EventAutomationNonProduction
  listeners:
    - name: gateway
      port: 8092
      groups:
        - name: gateway-group
          type: EXPLICIT
          maxNumKafkaBrokers: 20
          endpoint:
            host: eem-gateway-1-{{ eventautomation_namespace }}.{{ cluster_subdomain }}
      tls:
        caSecret:
          secretName:  {{ eventendpointmanagement_manager_name }}-ibm-eem-manager-ca
  template:
    pod:
      spec:
        containers:
          - name: egw
            resources:
              requests:
                cpu: '0.5'
                memory: 512Mi
              limits:
                cpu: '1'
                memory: 1Gi
